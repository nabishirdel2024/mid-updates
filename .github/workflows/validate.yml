name: اعتبارسنجی مانیفست نسخه

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: نصب اعتبارسنج JSON Schema
        run: python -m pip install check-jsonschema==0.38.2

      - name: اعتبارسنجی version.json با اسکیما
        run: check-jsonschema --schemafile schemas/version.schema.json version.json
